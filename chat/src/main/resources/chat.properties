# Ollama
ollama.base-url=http://localhost:11434
ollama.context-window=65536
ollama.max-context-window=131072
ollama.top-k=40
ollama.top-p=0.9
ollama.repeat-penalty=1.1
# Plafond de generation par defaut (en tokens) : filet de securite si le modele ne rencontre jamais
# sa stop sequence (voir RoleplayNarrator.STOP_SEQUENCES). Releve de 600 a 1200 (2026-07-13) : des
# reponses etaient parfois tronquees en cours de phrase avec 600, trop juste pour un tour a
# plusieurs paragraphes d'action+dialogue, surtout en francais (plus de tokens/mot qu'en anglais).
# Releve de 1200 a 2500 (2026-07-15) : ce plafond couvre la reflexion ET la reponse (think=true
# desormais toujours demande, voir RoleplayNarrator) — un raisonnement de 300-600 tokens grignotait
# une bonne part des 1200, au point de tronquer ou casser la reponse visible.
# Releve de 2500 a 3250, +30% (2026-07-16) : le thinking reste parfois volumineux meme a 2500,
# au point de laisser peu de marge a la reponse visible sur les tours les plus reflechis.
# Releve de 3250 a 4400 (2026-07-22) : la longueur du thinking est tres variable d'un tour a
# l'autre, et reste parfois tres long meme a 3250.
# Reglable dans l'UI par session (panneau reglages, voir GenerationSettings) sans toucher ce defaut.
ollama.num-predict=4400
ollama.retry-count=5
ollama.retry-delay1=15
ollama.retry-delay2=30
ollama.retry-delay3=60

# Mode d'appel Ollama : stream (recommande) ou sync — s'applique a tous les appels du module
# (roleplay et ChatSummarizer utilisent tous les deux ModelCallPort, /api/chat).
ollama.mode=stream

# Timeouts mode stream
ollama.stream.first-token-timeout-ms=300000
ollama.stream.inter-token-timeout-ms=30000

# Timeouts mode sync (si ollama.mode=sync)
ollama.timeout-ms=600000
ollama.large-model-ram-fraction-pct=60
ollama.large-model-timeout-multiplier=3

# llama-server — un seul modele deja charge par le process, pas de catalogue ni de menu GPU
# (voir LlamaServerAdapter). Le programme ne demarre/n'arrete jamais ce process : lancez-le
# vous-meme avant de choisir "2. llama-server" dans le menu de demarrage.
llamaserver.base-url=http://localhost:8100
llamaserver.model-name=
llamaserver.context-window=65536
llamaserver.top-k=40
llamaserver.top-p=0.9
llamaserver.repeat-penalty=1.1
llamaserver.num-predict=4400
llamaserver.retry-count=5
llamaserver.retry-delay1=15
llamaserver.retry-delay2=30
llamaserver.retry-delay3=60
llamaserver.mode=stream
llamaserver.stream.first-token-timeout-ms=300000
llamaserver.stream.inter-token-timeout-ms=30000
llamaserver.timeout-ms=600000

# Repertoire des chatscenarios — vide = repertoire du projet (chatscenarios/), jamais un chemin
# externe par defaut (voir CLAUDE.md : Claude n'a pas le droit d'acceder a du contenu hors projet).
chatscenarios.root.default=C:/dev/llm/story/chat

# Port prefere du serveur web local. S'il est occupe (autre chat en cours), le port suivant libre
# est utilise automatiquement (jusqu'a 20 essais) ; l'URL reelle est affichee au demarrage.
chat.web.port=8765
